<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" font-family="Segoe UI, Arial, sans-serif">
  <title>Ciclo del Sprint en Scrum</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b21a8"/></marker>
  </defs>
  <rect width="640" height="290" fill="#ffffff"/>
  <g fill="#ede9f8" stroke="#6b21a8" stroke-width="1.5">
    <rect x="20" y="30" width="140" height="44" rx="8"/>
    <rect x="250" y="30" width="140" height="44" rx="8"/>
    <rect x="480" y="30" width="140" height="44" rx="8"/>
    <rect x="480" y="150" width="140" height="44" rx="8" fill="#6b21a8"/>
    <rect x="250" y="150" width="140" height="44" rx="8"/>
    <rect x="20" y="150" width="140" height="44" rx="8"/>
  </g>
  <g fill="none" stroke="#6b21a8" stroke-width="1.5" marker-end="url(#a)">
    <path d="M160 52H248"/>
    <path d="M390 52H478"/>
    <path d="M550 74V148"/>
    <path d="M480 172H392"/>
    <path d="M250 172H162"/>
    <path d="M90 150V76"/>
  </g>
  <g fill="#6b21a8" font-size="13" text-anchor="middle">
    <text x="90" y="57">Product Backlog</text>
    <text x="320" y="57">Sprint Planning</text>
    <text x="550" y="57">Sprint Backlog</text>
    <text x="550" y="169" fill="#ffffff">Sprint (1–4 sem.)</text>
    <text x="550" y="185" fill="#ffffff" font-size="11">Daily Scrum cada día</text>
    <text x="320" y="177">Sprint Review</text>
    <text x="90" y="177">Retrospectiva</text>
  </g>
  <text x="100" y="117" fill="#64748b" font-size="11">nuevo Sprint</text>
  <text x="320" y="250" fill="#64748b" font-size="13" text-anchor="middle">Cada Sprint produce un Incremento que cumple la Definición de Terminado</text>
</svg>
